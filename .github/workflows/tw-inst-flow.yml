name: 台股法人資金流日報

on:
  schedule:
    # 10:00 UTC = 台北時間 18:00，週一到週五（證交所約 16:00-17:30 公布當日法人買賣超）
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: true
        default: selftest
        type: choice
        options: [selftest, dry-run, send]
      date:
        description: "指定日期 YYYYMMDD（留空=最近交易日）"
        required: false
        type: string
  push:
    branches: ["claude/**"]
    paths:
      - "tools/tw-inst-flow/**"
      - ".github/workflows/tw-inst-flow.yml"

concurrency:
  group: tw-inst-flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Anthropic SDK（AI 分析用）
        run: pip install --quiet anthropic

      - name: 決定執行模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=selftest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=send" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: TPEx 連線診斷（暫時）
        if: steps.mode.outputs.mode == 'selftest'
        continue-on-error: true
        run: |
          U=https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading
          echo "=== curl 連三次（看是否每次結果都一樣） ==="
          for i in 1 2 3; do
            curl -sS -o /dev/null -m 40 -w "  第$i次 http=%{http_code} ip=%{remote_ip} alpn\n" "$U" || echo "  第$i次 失敗"
          done
          echo "=== curl -4 / -6 ==="
          curl -4 -sS -o /dev/null -m 40 -w "  IPv4 http=%{http_code} ip=%{remote_ip}\n" "$U" || echo "  IPv4 失敗"
          curl -6 -sS -o /dev/null -m 40 -w "  IPv6 http=%{http_code} ip=%{remote_ip}\n" "$U" || echo "  IPv6 失敗"
          echo "=== DNS ==="
          getent ahosts www.tpex.org.tw | head
          echo "=== 憑證鏈與簽發者 ==="
          echo | openssl s_client -connect www.tpex.org.tw:443 -servername www.tpex.org.tw 2>/dev/null > /tmp/sc.txt
          grep -E "^(depth|verify|Verify| [0-9] (s|i):)" /tmp/sc.txt | head -20
          openssl x509 -in /tmp/sc.txt -noout -issuer -ext authorityInfoAccess 2>/dev/null || true
          echo "=== python 幾種連法 ==="
          python - <<'PY'
          import socket, ssl, urllib.request
          U = "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading"
          def attempt(label, ctx):
              try:
                  req = urllib.request.Request(U, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=40, context=ctx) as r:
                      n = len(r.read())
                  print(f"  {label}: OK {r.status} bytes={n}")
              except Exception as exc:
                  print(f"  {label}: 失敗 {type(exc).__name__} {exc}")
          attempt("預設", None)
          c = ssl.create_default_context(); c.set_alpn_protocols(["h2", "http/1.1"])
          attempt("ALPN h2", c)
          c2 = ssl.create_default_context(); c2.minimum_version = ssl.TLSVersion.TLSv1_2
          attempt("TLS1.2+", c2)
          for fam, label in ((socket.AF_INET, "IPv4"), (socket.AF_INET6, "IPv6")):
              try:
                  infos = socket.getaddrinfo("www.tpex.org.tw", 443, fam)
                  ip = infos[0][4][0]
                  ctx = ssl.create_default_context()
                  with socket.create_connection((ip, 443), timeout=20) as s:
                      with ctx.wrap_socket(s, server_hostname="www.tpex.org.tw") as ss:
                          print(f"  {label} {ip}: 握手 OK {ss.version()}")
              except Exception as exc:
                  print(f"  {label}: 失敗 {type(exc).__name__} {exc}")
          PY

      - name: 執行掃描
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -e
          ARGS=""
          [ -n "${{ inputs.date }}" ] && ARGS="--date ${{ inputs.date }}"
          case "${{ steps.mode.outputs.mode }}" in
            selftest) python tools/tw-inst-flow/scan.py --selftest $ARGS ;;
            dry-run)  python tools/tw-inst-flow/scan.py --dry-run --out out $ARGS ;;
            send)     python tools/tw-inst-flow/scan.py --out out $ARGS ;;
          esac

      - name: 保留報告檔（方便事後查看）
        if: steps.mode.outputs.mode != 'selftest'
        uses: actions/upload-artifact@v4
        with:
          name: tw-inst-flow-report
          path: out/
          if-no-files-found: ignore
          retention-days: 30
