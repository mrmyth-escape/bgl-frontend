name: 密室每日戰情簡報

on:
  schedule:
    # 00:30 UTC = 台北時間 08:30，每天（密室週末也營業）
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: true
        default: selftest
        type: choice
        options: [selftest, dry-run, send]
      date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
        type: string
  push:
    branches: ["claude/**"]
    paths:
      - "tools/bgl-daily-brief/**"
      - ".github/workflows/bgl-daily-brief.yml"

concurrency:
  group: bgl-daily-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Anthropic SDK（AI 摘要用）
        run: pip install --quiet anthropic

      - name: 決定執行模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=selftest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=send" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 產生簡報
        # push 時只是結構探測；後端尚未設定完成前失敗是預期的，不讓分支變紅燈
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -e
          ARGS=""
          [ -n "${{ inputs.date }}" ] && ARGS="--date ${{ inputs.date }}"
          case "${{ steps.mode.outputs.mode }}" in
            selftest) python tools/bgl-daily-brief/brief.py --selftest $ARGS ;;
            dry-run)  python tools/bgl-daily-brief/brief.py --dry-run $ARGS ;;
            send)     python tools/bgl-daily-brief/brief.py $ARGS ;;
          esac
